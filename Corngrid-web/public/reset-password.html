<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.ico">
  <title>CornGrid | Reset Password</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="login-wrapper">
    <main class="login-form-panel">
      <section class="form-container">
        <header class="form-header">
          <h3>Reset Password</h3>
          <p>Enter your new password. The password must be at least 8 characters long.</p>
        </header>

        <div id="resetAlert" class="alert-box" role="alert" aria-live="polite"></div>

        <form id="resetForm" class="auth-form">
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <div class="input-field">
              <i class="fas fa-lock input-icon" aria-hidden="true"></i>
              <input type="password" id="newPassword" minlength="8" required autocomplete="new-password">
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <div class="input-field">
              <i class="fas fa-lock input-icon" aria-hidden="true"></i>
              <input type="password" id="confirmPassword" minlength="8" required autocomplete="new-password">
            </div>
          </div>

          <button type="submit" class="btn-login-submit" id="resetSubmit">
            <span>Update Password</span>
          </button>
        </form>

        <div class="form-footer">
          <p><a href="/">Back to Login</a></p>
        </div>
      </section>
    </main>
  </div>
  <script src="reset-password.js"></script>
</body>
</html>
