<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080a0f">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/images/pwa-192.png">
  <link rel="stylesheet" href="/pwa.css">
  <title>CornGrid | Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261017-2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/pwa.js" defer></script>
</head>
<body class="reset-page">
  <header class="auth-topbar">
    <a class="auth-brand" href="/" aria-label="CornGrid home">
      <img src="/images/Corngrid logo 4k.jpg" alt="" class="brand-mark">
      <span>CORNGRID</span>
    </a>
    <nav aria-label="Account navigation">
      <a href="/">Home</a>
      <a href="/portfolios">Portfolios</a>
      <a href="/login">Sign in</a>
    </nav>
  </header>
  <div class="login-wrapper">
    <main class="login-form-panel">
      <section class="form-container">
        <header class="form-header">
          <h3>Reset Password</h3>
          <p>Enter your new password. The password must be at least 8 characters long.</p>
        </header>

        <div id="resetAlert" class="alert-box" role="alert" aria-live="polite"></div>

        <form id="resetForm" class="auth-form">
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <div class="input-field">
              <i class="fas fa-lock input-icon" aria-hidden="true"></i>
              <input type="password" id="newPassword" minlength="8" required autocomplete="new-password">
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <div class="input-field">
              <i class="fas fa-lock input-icon" aria-hidden="true"></i>
              <input type="password" id="confirmPassword" minlength="8" required autocomplete="new-password">
            </div>
          </div>

          <button type="submit" class="btn-login-submit" id="resetSubmit">
            <span>Update Password</span>
          </button>
        </form>

        <div class="form-footer">
          <p><a href="/login">Back to Login</a></p>
        </div>
      </section>
    </main>
  </div>
  <script src="reset-password.js?v=20261017-1"></script>
</body>
</html>
