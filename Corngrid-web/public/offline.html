<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0f">
  <title>Offline | CornGrid</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080a0f; color: #f4f5f7; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; min-height: 100dvh; margin: 0; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 32px; border: 1px solid #242a34; border-radius: 18px; background: #11151d; text-align: center; }
    img { width: 64px; height: 64px; border-radius: 14px; }
    h1 { margin: 22px 0 10px; font-size: clamp(24px, 7vw, 32px); }
    p { color: #aab1bf; line-height: 1.65; }
    button { min-height: 48px; margin-top: 14px; padding: 0 20px; border: 0; border-radius: 10px; background: #d8aa32; color: #11151d; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/images/pwa-192.png" alt="">
    <h1>You’re offline</h1>
    <p>CornGrid can’t connect right now. Reconnect to the internet to view current account and trading information.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
